# VRGB Core: the `vrgb` CLI and the importable `vrgb` module (stdlib only).
# Distro packages build from this; ./install.sh still just copies vrgb.py.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vrgb"
dynamic = ["version"]
description = "RGB control for ASUS Vivobook HID LampArray (ITE5570) keyboards"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/vrgb-dev/vrgb"

[project.scripts]
vrgb = "vrgb:run"

[tool.setuptools]
py-modules = ["vrgb"]

[tool.setuptools.dynamic]
version = {attr = "vrgb.VERSION"}

[tool.pytest.ini_options]
pythonpath = [".", "suite"]
testpaths = ["tests"]
